<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreightFlow | Operations</title><link rel="stylesheet" href="/static.css"></head><body><main><header><span class="eyebrow">OPERATIONS CONSOLE</span><h1>FreightFlow</h1><p>Shipment lifecycle management</p></header><section class="panel"><h2>Create shipment</h2><form id="create"><label>Customer <input name="customer" required maxlength="100" placeholder="Acme Logistics"></label><label>Origin <input name="origin" required placeholder="Fort Worth, TX"></label><label>Destination <input name="destination" required placeholder="Denver, CO"></label><label>Pieces <input name="pieces" type="number" min="1" max="100000" value="12" required></label><button>Create shipment</button></form><p id="message" role="status"></p></section><section class="panel"><div class="toolbar"><h2>Shipments</h2><button id="refresh" type="button">Refresh</button></div><div class="scroll"><table><thead><tr><th>ID</th><th>Customer</th><th>Route</th><th>Pieces</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section><footer>Demonstration system · Not connected to real freight networks</footer></main><script src="/app.js"></script></body></html>
